name: 功能建议
description: 新玩法、新特效、体验改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述当前体验中不舒服的地方，而不是直接给方案。
      placeholder: 例如「切大容器时，里面的卡片会一起消失，看起来像整块被抹掉」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的效果
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 目标判定 / 尺寸挡位
        - 刀光 / 粒子 / 高亮框
        - 碎片切分与分离
        - 顿感 / 时序
        - 扩展外壳（弹窗、快捷键、存储）
        - 教程关
        - 其他

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 这可能改变现有手感（需要提供前后对比）
